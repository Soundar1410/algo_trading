[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading"
version = "0.1.0"
description = "Local forward-testing platform: paper execution on Dhan live market data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Soundarraj" }]

dependencies = [
    # Dhan SDK. Pinned exactly, never a range: the feed/auth surface changed
    # between 2.1 (DhanContext) and 2.2 (documented breaking changes). The
    # compatibility spike that ratifies this pin is a Phase 2 deliverable.
    "dhanhq==2.1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta-classic>=0.3",     # indicators, behind one adapter (Phase 4)
    "pyotp>=2.9",                 # TOTP for the Dhan auth bootstrap (Phase 2)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",                # Telegram + REST (Phase 1/7)
    "tenacity>=8.3",              # bounded retries for idempotent operations
    "streamlit>=1.35",            # read-only dashboard (Phase 1 tile onwards)
    "filelock>=3.14",             # migration, token-cache and process locks
    "psutil>=5.9",                # PID validation beyond bare pid-file checks
]

[project.optional-dependencies]
# NOT installed by default: py_lets_be_rational can be awkward to build on some
# macOS/Python combinations. Add only when a named strategy needs Greek
# estimation between Dhan Option Chain snapshots (spec section 17).
greeks = ["py_vollib>=1.0"]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["common"]
strict = true
warn_unreachable = true
