[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading"
version = "0.1.0"
description = "Local forward-testing platform: paper execution on Dhan live market data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Soundarraj" }]

dependencies = [
    # Dhan SDK. Pinned exactly, never a range. Ratified in Phase 2 by the
    # compatibility spike the spec requires; see the runbook for the evidence.
    # 2.1.0 was rejected: it is *yanked* on PyPI ("Breaking changes"), its
    # subscribe_symbols/unsubscribe_symbols read `ws.closed` which no longer
    # exists on websockets>=14 (so resubscription after reconnect raises
    # AttributeError), and its disconnect() never closes the socket. 2.2.0 fixes
    # all three. The tick/quote payload builders are byte-identical across the
    # two versions, so normalisation is unaffected by the bump.
    "dhanhq==2.2.0",
    # Pinned as a floor, not left to the SDK: 2.2.0 guards the `ws.closed`
    # removal, so we require a websockets new enough to have removed it rather
    # than silently resolving to a pre-14 release where the guard is moot.
    "websockets>=14",
    # NumPy >=2.4's inline stubs use Python-3.12-only ``type`` statements;
    # this project supports and type-checks as Python 3.11, so that range
    # makes the required mypy command fail before it reaches our code.
    # pandas 3.0.5's published wheel is missing pandas.compat.compressors in
    # the supported environment and fails at import before our code runs.
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<2.4",
    "pandas-ta-classic>=0.3",     # indicators, behind one adapter (Phase 4)
    "pyotp>=2.9",                 # TOTP for the Dhan auth bootstrap (Phase 2)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",                # Telegram + REST (Phase 1/7)
    "tenacity>=8.3",              # bounded retries for idempotent operations
    "streamlit>=1.35",            # read-only dashboard (Phase 1 tile onwards)
    "filelock>=3.14",             # migration, token-cache and process locks
    "psutil>=5.9",                # PID validation beyond bare pid-file checks
]

[project.scripts]
# Phase 5: the supervisor entrypoint, previously only reachable as
# `python -m runtimes.intraday_options`. Both keep working; this is a
# convenience alias installed with the package.
algo-intraday-options = "runtimes.intraday_options.__main__:main"
# Phase 8: same convenience alias for the dashboard, matching the plist
# generator's own `-m scripts.start_dashboard` target.
algo-dashboard = "scripts.start_dashboard:main"

[project.optional-dependencies]
# weekly_delta_neutral (strategy-weekly-delta-neutral branch) is the first named
# strategy that needs Greek estimation between Dhan Option Chain snapshots (spec
# section 17), so this is no longer speculative — but it stays a genuine "extra"
# rather than a core dependency: the intraday-only platform (ema_cross_9_21_buy,
# straddle_920) never needs it. Verified on this Mac (arm64/cp311) to resolve to
# prebuilt wheels with no compilation via its `vollib` dependency, compatible
# with the pandas<3.0/numpy<2.4 pins above. Pinned exactly in requirements.lock
# (the documented install path installs it unconditionally, extras marker or
# not) so `common.greeks.model`'s fallback path is always exercised in CI.
# common.greeks.model imports the underlying `vollib` package directly (py_vollib
# itself is a deprecated compatibility shim over it, per its own DeprecationWarning)
# — `py_vollib` is named here only because it is the dependency that pulls `vollib`
# in; nothing in this repository calls `py_vollib.*` at runtime.
greeks = ["py_vollib>=1.0"]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-psutil",
]

[tool.setuptools.packages.find]
include = ["common*", "strategies*", "runtimes*", "dashboards*", "scripts*", "orchestration*"]

[tool.setuptools.package-data]
common = ["persistence/migrations/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "real_audit: exercises the real errors-table rows supervised_launch writes (not mocked)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["common", "strategies", "runtimes", "dashboards", "scripts"]
strict = true
warn_unreachable = true

# dhanhq ships no py.typed marker, so its API is untyped to mypy. The ignore is
# scoped to that one module rather than applied globally: it is confined to
# common/market_data/dhan.py, which is the only importer, so an untyped value
# cannot leak into execution or persistence code without being caught.
[[tool.mypy.overrides]]
module = ["dhanhq.*"]
ignore_missing_imports = true

# pandas ships no inline types and `pandas-stubs` is a separate package. Scoped
# to pandas itself rather than applied globally: the only importers are
# common/indicators/supertrend.py (its vectorised warm-up form) and
# common/indicators/vectorised.py, so an untyped frame cannot leak into
# execution or persistence code unnoticed.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# pandas-ta-classic ships no py.typed marker. Scoped tightly for the same reason
# as the two above, and the scope is unusually meaningful here: this library is
# the cross-check *oracle* and must never reach the live incremental path. Its
# only importer is common/indicators/vectorised.py, and
# tests/unit/test_indicator_oracle_boundary.py enforces that structurally rather
# than trusting this comment.
[[tool.mypy.overrides]]
module = ["pandas_ta_classic.*"]
ignore_missing_imports = true

# vollib (the py_vollib extra's actual runtime dependency — see the extras
# comment above) ships no py.typed marker. Scoped to that package alone: its
# only importer is common/greeks/model.py, the one place this repository is
# permitted to call a third-party option-pricing function from.
[[tool.mypy.overrides]]
module = ["vollib.*"]
ignore_missing_imports = true
