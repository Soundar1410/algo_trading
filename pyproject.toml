[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-trading"
version = "0.1.0"
description = "Local forward-testing platform: paper execution on Dhan live market data."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Soundarraj" }]

dependencies = [
    # Dhan SDK. Pinned exactly, never a range. Ratified in Phase 2 by the
    # compatibility spike the spec requires; see the runbook for the evidence.
    # 2.1.0 was rejected: it is *yanked* on PyPI ("Breaking changes"), its
    # subscribe_symbols/unsubscribe_symbols read `ws.closed` which no longer
    # exists on websockets>=14 (so resubscription after reconnect raises
    # AttributeError), and its disconnect() never closes the socket. 2.2.0 fixes
    # all three. The tick/quote payload builders are byte-identical across the
    # two versions, so normalisation is unaffected by the bump.
    "dhanhq==2.2.0",
    # Pinned as a floor, not left to the SDK: 2.2.0 guards the `ws.closed`
    # removal, so we require a websockets new enough to have removed it rather
    # than silently resolving to a pre-14 release where the guard is moot.
    "websockets>=14",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta-classic>=0.3",     # indicators, behind one adapter (Phase 4)
    "pyotp>=2.9",                 # TOTP for the Dhan auth bootstrap (Phase 2)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "httpx>=0.27",                # Telegram + REST (Phase 1/7)
    "tenacity>=8.3",              # bounded retries for idempotent operations
    "streamlit>=1.35",            # read-only dashboard (Phase 1 tile onwards)
    "filelock>=3.14",             # migration, token-cache and process locks
    "psutil>=5.9",                # PID validation beyond bare pid-file checks
]

[project.optional-dependencies]
# NOT installed by default: py_lets_be_rational can be awkward to build on some
# macOS/Python combinations. Add only when a named strategy needs Greek
# estimation between Dhan Option Chain snapshots (spec section 17).
greeks = ["py_vollib>=1.0"]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["common", "strategies", "runtimes", "dashboards", "scripts"]
strict = true
warn_unreachable = true

# dhanhq ships no py.typed marker, so its API is untyped to mypy. The ignore is
# scoped to that one module rather than applied globally: it is confined to
# common/market_data/dhan.py, which is the only importer, so an untyped value
# cannot leak into execution or persistence code without being caught.
[[tool.mypy.overrides]]
module = ["dhanhq.*"]
ignore_missing_imports = true

# pandas ships no inline types and `pandas-stubs` is a separate package. Scoped
# to pandas itself rather than applied globally: the only importers are
# common/indicators/supertrend.py (its vectorised warm-up form) and
# common/indicators/vectorised.py, so an untyped frame cannot leak into
# execution or persistence code unnoticed.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

# pandas-ta-classic ships no py.typed marker. Scoped tightly for the same reason
# as the two above, and the scope is unusually meaningful here: this library is
# the cross-check *oracle* and must never reach the live incremental path. Its
# only importer is common/indicators/vectorised.py, and
# tests/unit/test_indicator_oracle_boundary.py enforces that structurally rather
# than trusting this comment.
[[tool.mypy.overrides]]
module = ["pandas_ta_classic.*"]
ignore_missing_imports = true
