# Walking-skeleton test fixture — NOT a trading strategy.
#
# This exists to exercise the Phase 1 plumbing end to end. It has no market
# hypothesis: it buys on the first completed candle and sells on the third,
# purely so a test can assert that one candle produced exactly one order.
#
# Real strategies arrive in Phase 9, on the preserved engines. Do not copy this
# file as a template for one.

strategy_id: skeleton_fixture
enabled: false

# Paper only. Setting this to `live` will not start a live strategy: the broker
# factory consults the live gate and refuses, and live order placement does not
# exist until Phase 10.
mode: paper
live_approved: false

engine: trading_engine

risk:
  max_position_quantity: 50
  entry_cutoff: "15:00"
  square_off_at: "15:15"

parameters:
  instrument: NIFTY
  security_id: "99926000"
  quantity: 50
  entry_on_candle: 1
  exit_on_candle: 3
  candle_interval_seconds: 60

  paper_execution:
    # The spec's section 6 shape. `slippage_points: 0.05` is still accepted and
    # means the same thing here — one NSE index-option tick is ₹0.05 — but ticks
    # are what the spec names for options, and a whole number of them keeps a
    # simulated fill on the tick grid by construction.
    slippage:
      options:
        mode: ticks
        market_order_ticks: 1
    submission_latency_ms: 250
    tick_size: 0.05
    allow_ltp_fallback: true
    # Spec 5.1 permits the last-price fallback only with a conservative extra
    # cost. A price taken from the last trade rather than a resting order is a
    # worse estimate of what we would have paid, so it must cost more.
    ltp_fallback_extra_ticks: 1
    # Explicitly off. This fixture replays a recorded tape whose timestamps are
    # historic, so a freshness check against the wall clock would refuse every
    # order. A live-feed configuration should set this (e.g. 2000).
    max_quote_age_ms: null
