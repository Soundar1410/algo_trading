# c509_ema_cross_buy — the second real strategy, a faithful clone of
# c921_ema_cross_buy with only the EMA periods (5/9 instead of 9/21) and
# identity changed. Full spec: strategies/intraday_options/c509_ema_cross_buy/
# c509_ema_cross_buy_spec.md; c921_ema_cross_buy_spec.md remains the shared
# behavioural source of truth for everything not called out as different.
# Do not copy config/strategies/skeleton_fixture.yaml as a template — that
# file is explicitly not one (see its own header).
#
# Renamed from ema_cross_5_9_buy on 31 August 2026: the original id shared
# its first 4 sanitised characters ("emac") with c921_ema_cross_buy and
# ema_cross_5_21_buy, so common.execution.correlation.strategy_token()
# collided across all three and runtimes/intraday_options/supervisor.py's
# add_worker refused to admit more than one at a time. The distinguishing
# digits now sit first — see docs/IMPLEMENTATION_STATUS_AND_RUNBOOK.md for
# the full addendum. strategy_id below is otherwise unchanged in meaning.
#
# Shipped DISABLED (enabled: false, operator decision): built, tested and
# discoverable, but does not run on the shared intraday_options feed
# alongside c921_ema_cross_buy until deliberately enabled. Runnable in
# isolation via the runtime's --strategy-id c509_ema_cross_buy selector.
#
# PAPER ONLY at delivery. Setting mode to `live` will NOT start a live
# strategy: the broker factory consults the live gate (common.config.models.
# effective_live_gate) and refuses. Phase 10's live machinery exists but every
# committed gate remains disabled; operational activation requires separate
# evidence and explicit approval.

strategy_id: c509_ema_cross_buy
runtime_id: intraday_options
enabled: true

mode: paper
live_approved: false

# Labels the single-leg engine family (spec section 1's "preserved custom
# engine"). parameters.strategy_ref below is what actually tells
# runtimes/intraday_options/config_adapter.py to drive the ported
# TradingEngine rather than the Phase 1 fixture path — see that module's
# docstring for why EngineKind alone cannot be the discriminator.
engine: trading_engine
# Descriptive only (common.config.models.StrategyStyle) — the dashboard's
# Style filter. Never read by the engine/risk path. buying: this strategy
# only ever buys options (see strategy.py's trade_side property).
style: buying

risk:
  # Session entries allowed 09:15 -> 14:45 (spec section 8). entry_start feeds
  # EngineWorkerConfig.session_start_time; entry_cutoff/square_off_at feed the
  # SquareOffPolicy that both the entry-cutoff gate and the mandatory 15:15
  # square-off already derive from (common.engine.config.SessionConfig.
  # from_square_off_policy) — one configured pair, not two independently
  # configured times that can drift apart.
  entry_start: "09:15"
  entry_cutoff: "14:45"
  square_off_at: "15:15"

parameters:
  # ------------------------------------------------------- required, both paths
  instrument: NIFTY
  # NIFTY index security id (common.market_data.scrip_master.INDEX_REGISTRY).
  security_id: "13"

  # ------------------------------------------------- engine-path discriminator
  strategy_ref: "strategies.intraday_options.c509_ema_cross_buy.strategy:EmaCross5x9BuyStrategy"

  # EmaCross5x9BuyStrategy's own constructor kwargs (spec sections 4, 6.1, 7,
  # 12.4, 12.6). Travels through config_adapter.py verbatim -- see its
  # _build_engine_worker_config docstring.
  strategy_kwargs:
    ema_fast: 5
    ema_slow: 9
    # Pure closed-candle sign-flip cross, confirmed on the closing candle of
    # the flip itself (spec 12.6, kept identical to c921_ema_cross_buy —
    # operator decision: no whipsaw damping for the faster 5/9 pair).
    minimum_separation: 0
    confirmation_candles: 1
    # lots_per_trade is a sizing CHOICE (config); lot_size is NOT configured
    # anywhere here -- it is resolved from the scrip master at runtime (see
    # contract_resolver below) and multiplied in by
    # OpenPosition.quantity = lots * contract.lot_size. Order quantity for
    # this strategy = 10 * <scrip-master NIFTY weekly lot size>.
    lots_per_trade: 10
    # momentum_low_or_highest_close (spec 6.1): 4% activates the best-close
    # trail only; the momentum-break leg has no activation gate (12.4,
    # settled: "the momentum structure leg remains active before +4%").
    trail_percentage: 8.0
    activation_minimum_favourable_move_percentage: 4.0
    # Minimal per-position backstop (spec 7 / 12.5). Disabled by default --
    # the premium-candle combined exit above is the primary exit; see
    # common.engine.risk_managers.HardStopRiskManager for why this is an
    # absolute per-lot rupee floor rather than a percentage of premium, and
    # why that is the honest choice under the existing RiskManager contract.
    risk_manager_name: hard_stop
    risk_manager_params:
      catastrophic_stop_rupees_per_lot: none

  # ------------------------------------------------------------- candle/session
  timeframe: "5m"

  # --------------------------------------------------------- option resolution
  # "dhan" resolves real NIFTY weekly contracts (strike, expiry AND lot size)
  # from the exchange's own daily instrument master at runtime -- spec
  # section 3 / 12.2. Never hardcode a lot size or a weekly-expiry date.
  contract_resolver: dhan
  strike_step: 50
  # Fallback lot size, used ONLY if contract_resolver is switched to
  # "simulated" (e.g. an offline/paper-tape run with no scrip master). Ignored
  # entirely by the "dhan" resolver above, which reads the real one.
  lot_size: 75
  expiry: null
  index_security_id: ""
  index_segment: ""
  fno_segment: ""
  scrip_master_cache_dir: ""

  # ----------------------------------------------------- daily 3% live-MTM cap
  # capital_base = Rs 10,00,000 (same base as c921_ema_cross_buy -- spec
  # section 12.1/6.3: each strategy carries its own independent cap, no
  # combined cap across strategies). daily_max_loss_pct converts to an
  # ABSOLUTE rupee daily_max_loss = 0.03 * capital_base = Rs 30,000, evaluated
  # every tick on LIVE MTM (realised so far + this position's open unrealised
  # P&L) -- common.engine.daily_guard.DailyRiskGuard.check_open_mtm, wired by
  # TradingEngine itself (common.engine.engine.TradingEngine.
  # _build_daily_guard / _on_option_tick). Latching: halts new entries and
  # squares off for the rest of the day once tripped.
  capital_base: 1000000
  daily_max_loss_pct: 3.0

  # ------------------------------------------------------------------- warm-up
  # EMA(5)/EMA(9) are SESSION_SPANNING (common.warmup.requirements): prior-
  # session history is valid and desirable, so a mid-session start behaves
  # like a bot that ran since the open. Not continuity_required (unlike
  # SuperTrend), so this strategy still trades correctly cold -- see
  # EmaCross5x9BuyStrategy.on_candle's is_ready gate -- but "dhan" warm-up is
  # configured here so the fresh-crossover rule is evaluated against a
  # genuinely warmed indicator in normal operation.
  warmup_from_history: true
  warmup_source: dhan
  warmup_max_lookback_sessions: 3

  regime_enabled: false

  paper_execution:
    slippage:
      options:
        mode: ticks
        market_order_ticks: 1
    submission_latency_ms: 250
    tick_size: 0.05
    allow_ltp_fallback: true
    ltp_fallback_extra_ticks: 1
    # Live feed: reject a quote older than 2s rather than fill on stale data.
    max_quote_age_ms: 2000
