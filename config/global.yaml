# Account-wide configuration.
#
# Secrets never appear here — they live only in the gitignored .env.
# Execution mode is NOT set here: it belongs to each individual strategy.
# The flags below are safety permissions, and they can only ever *block* live
# execution, never turn a live strategy into a paper one.

global:
  # Master live kill switch. Fail-closed: stays false until the controlled-live
  # phase (Phase 10). While false, a strategy configured `mode: live` is blocked
  # from starting — it is never silently rerouted to paper.
  live_trading_enabled: false
  timezone: Asia/Kolkata

# Unattended PAPER-mode startup (orchestration.auto_start).
#
# `enabled: false` is a hard gate, separate from installing the LaunchAgent:
# the agent may be installed and loaded while this stays false, and nothing
# will start. Flipping it is a deliberate operator step — see the runbook's
# auto-start enablement checklist.
#
# This block deliberately names NO runtime or strategy. What actually starts is
# decided entirely by `enabled:` in config/runtimes/*.yaml and
# config/strategies/*.yaml, which this cannot override.
auto_start:
  enabled: false

  # Every decision is made in this zone regardless of the Mac's own setting.
  # launchd's StartCalendarInterval, however, fires in the Mac's LOCAL zone —
  # so a Mac on the wrong zone fires at the wrong instant. The default is to
  # refuse rather than trade on a clock we cannot vouch for.
  timezone: Asia/Kolkata
  require_system_timezone_match: true

  # A login before startup_time exits 0 and waits for the 09:00 trigger.
  startup_time: "09:00"
  # Late-start eligibility deliberately runs to the session deadline: a
  # positional runtime with an open weekly cycle must still start at 11:00 to
  # recover and manage that exposure. Whether a NEW entry is permitted is the
  # strategy's own entry-cutoff decision, never this file's.
  latest_start_time: "15:15"
  session_deadline_time: "15:15"

  # Transient-failure retry (no network, DNS, timeout, 5xx, unmounted volume).
  # Credential rejection and malformed config are terminal and never retried.
  retry_interval_seconds: 30.0
  retry_backoff_multiplier: 1.5
  retry_max_interval_seconds: 300.0

  # A spawned runtime must take its own supervisor lock within this window or
  # the launch is reported as failed — Popen returning is not "started".
  runtime_handshake_seconds: 120.0
  shutdown_grace_seconds: 30.0

  # The dashboard has exactly one owner: its own RunAtLoad LaunchAgent. The
  # trading controller never starts it. This flag is what that agent reads.
  dashboard_auto_start: true

  telegram_retry_attempts: 3
  telegram_retry_delay_seconds: 5.0

  # NSE trading holidays, ISO dates. Fed straight to MarketSession, so weekend
  # and holiday rules are the engine's own — never a second copy.
  #
  # PROVENANCE (read before trusting this list): compiled 2026-08-20 by
  # cross-checking three independent published calendars (ClearTax, Groww,
  # Bajaj AMC), which agree on all sixteen dates. Every day-of-week was then
  # verified programmatically. This is NOT NSE's own circular — nseindia.com's
  # holiday API was unreachable at the time of writing — so an operator MUST
  # reconcile this against the official circular
  # (https://www.nseindia.com, "Market Timings & Holidays") before enabling
  # unattended startup, and re-check it whenever NSE issues an amendment.
  # NSE does add holidays mid-year by circular: 2026-01-15 below is exactly
  # such a case (Maharashtra municipal elections).
  #
  # WHICH DIRECTION IS DANGEROUS: a *missing* holiday is noisy but harmless —
  # the platform starts, finds a closed market and trades nothing. A *spurious*
  # holiday is the dangerous one: the platform does not start at all, and an
  # open weekly_delta_neutral cycle goes unmanaged for a full session. Never
  # add a date here that has not been verified.
  #
  # Weekend-falling holidays are deliberately omitted: MarketSession already
  # excludes Saturdays and Sundays, so listing them would be redundant. That
  # also means the Sunday 2026-11-08 Diwali Muhurat session (a one-hour
  # evening special) is not a trading day for this platform — a 09:00
  # unattended start must not attempt it.
  holidays:
    - "2026-01-15"  # Thu — Municipal Corporation Election, Maharashtra
    - "2026-01-26"  # Mon — Republic Day
    - "2026-03-03"  # Tue — Holi
    - "2026-03-26"  # Thu — Shri Ram Navami
    - "2026-03-31"  # Tue — Shri Mahavir Jayanti
    - "2026-04-03"  # Fri — Good Friday
    - "2026-04-14"  # Tue — Dr. Baba Saheb Ambedkar Jayanti
    - "2026-05-01"  # Fri — Maharashtra Day
    - "2026-05-28"  # Thu — Bakri Id
    - "2026-06-26"  # Fri — Muharram
    - "2026-09-14"  # Mon — Ganesh Chaturthi
    - "2026-10-02"  # Fri — Mahatma Gandhi Jayanti
    - "2026-10-20"  # Tue — Dussehra
    - "2026-11-10"  # Tue — Diwali Balipratipada
    - "2026-11-24"  # Tue — Prakash Gurpurb Sri Guru Nanak Dev
    - "2026-12-25"  # Fri — Christmas

# Defaults inherited by every runtime group; a runtime file overrides key by key.
runtime_defaults:
  enabled: false
  live_execution_allowed: false
  shared_market_feed: true

# Defaults inherited by every strategy; runtime and strategy files override
# these key by key. All safety defaults are the restrictive ones.
strategy_defaults:
  enabled: false
  mode: paper
  live_approved: false
  # Spec section 11's own safer default, made explicit here rather than left
  # implicit in code. simulate_exchange_settlement is refused at config load
  # until a tested settlement simulator exists (Phase 6 Part 4).
  expiry_policy: force_square_off_before_expiry
