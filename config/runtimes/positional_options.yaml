# Positional options strategy group.
#
# Named in the spec's own configuration-organisation example (section 9) and
# in Phase 5's own instrument-class-rollout bullet ("add positional options
# and intraday stocks one at a time"). `runtimes/positional_options/` is now
# a real, single-process supervisor/worker (weekly_delta_neutral) — see that
# package's own module docstrings for the single-process design decision.
#
# `enabled: false` until a 30-day paper evaluation and separate approval
# clear it for operational start (CLAUDE.md). Nothing in this repository
# auto-starts a runtime from this file; an operator runs
# `python -m runtimes.positional_options` explicitly, and that entrypoint
# itself refuses to start while this stays false.

runtime_id: positional_options
enabled: true
live_execution_allowed: false
shared_market_feed: true
database: data/operational/positional_options.db
